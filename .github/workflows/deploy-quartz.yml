name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          path: vault
          fetch-depth: 0

      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: quartz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare content and theme
        run: |
          cd quartz
          rm -rf content
          mkdir -p content

          rsync -a \
            --exclude='.obsidian' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='quartz-config' \
            --exclude='99 - Templates' \
            ../vault/ content/

          if [ ! -f content/index.md ]; then
            if [ -f "content/00 - Start Here/Home.md" ]; then
              cp "content/00 - Start Here/Home.md" content/index.md
            else
              echo -e "---\ntitle: Linux Sysadmin Notes\n---\n\n# Linux Sysadmin Notes\n\nPractical reference notes." > content/index.md
            fi
          fi

          if [ -f ../vault/quartz-config/quartz.config.ts ]; then
            cp ../vault/quartz-config/quartz.config.ts ./quartz.config.ts
            echo "Applied custom quartz.config.ts"
          fi
          if [ -f ../vault/quartz-config/quartz.layout.ts ]; then
            cp ../vault/quartz-config/quartz.layout.ts ./quartz.layout.ts
            echo "Applied custom quartz.layout.ts"
          fi
          if [ -f ../vault/quartz-config/custom.scss ]; then
            cp ../vault/quartz-config/custom.scss ./quartz/styles/custom.scss
            echo "Applied custom.scss"
          fi

          if [ -f ../vault/quartz-config/AudioPlayer.tsx ]; then
            cp ../vault/quartz-config/AudioPlayer.tsx ./quartz/components/AudioPlayer.tsx
            mkdir -p ./quartz/components/scripts ./quartz/components/styles
            cp ../vault/quartz-config/audioplayer.inline.ts ./quartz/components/scripts/audioplayer.inline.ts
            cp ../vault/quartz-config/audioplayer.scss ./quartz/components/styles/audioplayer.scss
            echo "Applied AudioPlayer component"
          fi

      - name: Install and build Quartz
        working-directory: quartz
        run: |
          npm ci
          npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
